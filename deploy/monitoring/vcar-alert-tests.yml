rule_files:
  - /etc/prometheus/vcar-alert-rules.yml
evaluation_interval: 1m
tests:
  - interval: 1m
    alert_rule_test:
      - eval_time: 6m
        alertname: VcarBackupMetricsMissing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Vcar database backup telemetry is missing
              description: The backup textfile metrics are absent; verify the scheduled backup job and node_exporter textfile collector configuration.
  - interval: 1m
    input_series:
      - series: 'vcar_redis_available'
        values: '0+0x5'
      - series: 'vcar_driver_presence_reconciliation_consecutive_failures'
        values: '3+0x10'
      - series: 'vcar_driver_presence_reconciliation_last_success_timestamp'
        values: '1+0x1500'
      - series: 'vcar_driver_presence_reconciliation_last_success_timestamp{instance="never"}'
        values: '0+0x10'
      - series: 'vcar_order_event_outbox_high_retry'
        values: '1+0x10'
      - series: 'vcar_backup_last_run_success'
        values: '0+0x5'
      - series: 'vcar_backup_last_success_timestamp_seconds'
        values: '0+0x1500'
      - series: 'probe_success{job="blackbox-vcar",instance="http://vcar:8080/health/ready"}'
        values: '0+0x5'
      - series: 'probe_success{job="blackbox-vcar",instance="http://osrm:5000/route/v1/driving/104.9,11.5;104.95,11.55"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: VcarDriverPresenceReconciliationFailing
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Vcar driver presence reconciliation is failing
              description: PostgreSQL-to-Redis driver presence repair has failed at least three consecutive cycles.
      - eval_time: 3m
        alertname: VcarDriverPresenceReconciliationStalled
        exp_alerts:
          - exp_labels:
              severity: warning
              instance: never
            exp_annotations:
              summary: Vcar driver presence reconciliation is stale
              description: The PostgreSQL-to-Redis driver presence repair has never succeeded or has not completed successfully for more than two minutes.
      - eval_time: 6m
        alertname: VcarDriverPresenceReconciliationStalled
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Vcar driver presence reconciliation is stale
              description: The PostgreSQL-to-Redis driver presence repair has never succeeded or has not completed successfully for more than two minutes.
          - exp_labels:
              severity: warning
              instance: never
            exp_annotations:
              summary: Vcar driver presence reconciliation is stale
              description: The PostgreSQL-to-Redis driver presence repair has never succeeded or has not completed successfully for more than two minutes.
      - eval_time: 6m
        alertname: VcarOrderOutboxHighRetry
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: Vcar order events are repeatedly failing delivery
              description: One or more undelivered order events have reached at least eight delivery attempts.
      - eval_time: 3m
        alertname: VcarRedisUnavailable
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Vcar Redis dependency is unavailable
              description: Vcar metrics can still be scraped, but Redis PING has failed for more than two minutes.
      - eval_time: 3m
        alertname: VcarBlackboxProbeFailed
        exp_alerts:
          - exp_labels:
              severity: critical
              job: blackbox-vcar
              instance: http://vcar:8080/health/ready
            exp_annotations:
              summary: A Vcar HTTP or routing probe is failing
              description: Blackbox Exporter has failed a configured Vcar health or OSRM route probe for more than two minutes.
          - exp_labels:
              severity: critical
              job: blackbox-vcar
              instance: http://osrm:5000/route/v1/driving/104.9,11.5;104.95,11.55
            exp_annotations:
              summary: A Vcar HTTP or routing probe is failing
              description: Blackbox Exporter has failed a configured Vcar health or OSRM route probe for more than two minutes.
      - eval_time: 3m
        alertname: VcarOSRMProbeFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: blackbox-vcar
              instance: http://osrm:5000/route/v1/driving/104.9,11.5;104.95,11.55
            exp_annotations:
              summary: Vcar OSRM route probe is failing
              description: The configured Cambodia OSRM route probe has failed for more than two minutes.
      - eval_time: 3m
        alertname: VcarBackupLastRunFailed
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Vcar database backup failed
              description: The most recent database backup did not complete and verify; inspect the backup job before relying on recovery points.
      - eval_time: 25h
        alertname: VcarBackupLastSuccessStale
        exp_alerts:
          - exp_labels:
              severity: critical
            exp_annotations:
              summary: Vcar database backup is overdue
              description: No verified database backup has completed within the last 24 hours.
