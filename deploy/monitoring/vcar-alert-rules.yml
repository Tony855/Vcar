groups:
  - name: vcar-reliability
    rules:
      - alert: VcarMetricsTargetDown
        expr: up{job="vcar-app"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Vcar metrics endpoint is unreachable
          description: Prometheus has failed to scrape the authenticated Vcar metrics endpoint for more than two minutes.

      - alert: VcarBlackboxProbeFailed
        expr: probe_success{job="blackbox-vcar"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: A Vcar HTTP or routing probe is failing
          description: Blackbox Exporter has failed a configured Vcar health or OSRM route probe for more than two minutes.

      - alert: VcarOSRMProbeFailed
        expr: probe_success{job="blackbox-vcar",instance=~".*/route/.*"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Vcar OSRM route probe is failing
          description: The configured Cambodia OSRM route probe has failed for more than two minutes.

      - alert: VcarRedisUnavailable
        expr: vcar_redis_available == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Vcar Redis dependency is unavailable
          description: Vcar metrics can still be scraped, but Redis PING has failed for more than two minutes.

      - alert: VcarDriverPresenceReconciliationFailing
        expr: vcar_driver_presence_reconciliation_consecutive_failures >= 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Vcar driver presence reconciliation is failing
          description: PostgreSQL-to-Redis driver presence repair has failed at least three consecutive cycles.

      - alert: VcarDriverPresenceReconciliationStalled
        expr: vcar_driver_presence_reconciliation_last_success_timestamp == 0 or (vcar_driver_presence_reconciliation_last_success_timestamp > 0 and time() - vcar_driver_presence_reconciliation_last_success_timestamp > 120)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Vcar driver presence reconciliation is stale
          description: The PostgreSQL-to-Redis driver presence repair has never succeeded or has not completed successfully for more than two minutes.

      - alert: VcarOrderOutboxHighRetry
        expr: vcar_order_event_outbox_high_retry > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vcar order events are repeatedly failing delivery
          description: One or more undelivered order events have reached at least eight delivery attempts.

      - alert: VcarDatabasePoolSaturated
        expr: vcar_database_pool_max_connections > 0 and (vcar_database_pool_connections - vcar_database_pool_idle_connections) / vcar_database_pool_max_connections > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vcar database connection pool is near capacity
          description: More than 85 percent of the configured database pool has been checked out for five minutes.

      - alert: VcarOrderOutboxBacklog
        expr: vcar_order_event_outbox_pending > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Vcar order event outbox backlog is growing
          description: More than 100 order status events have remained undelivered for five minutes.

      - alert: VcarOrderOutboxDeliveryStalled
        expr: vcar_order_event_outbox_oldest_age_seconds > 300
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Vcar has an old undelivered order event
          description: The oldest pending order event is more than five minutes old.

      - alert: VcarBackupMetricsMissing
        expr: absent(vcar_backup_last_success_timestamp_seconds) or absent(vcar_backup_last_run_success)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Vcar database backup telemetry is missing
          description: The backup textfile metrics are absent; verify the scheduled backup job and node_exporter textfile collector configuration.

      - alert: VcarBackupLastRunFailed
        expr: vcar_backup_last_run_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Vcar database backup failed
          description: The most recent database backup did not complete and verify; inspect the backup job before relying on recovery points.

      - alert: VcarBackupLastSuccessStale
        expr: time() - vcar_backup_last_success_timestamp_seconds > 86400
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Vcar database backup is overdue
          description: No verified database backup has completed within the last 24 hours.

      - alert: VcarHostCpuSaturated
        expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Vcar host CPU is saturated
          description: Host CPU utilization has remained above 85 percent for ten minutes.

      - alert: VcarHostMemoryPressure
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Vcar host memory is under pressure
          description: Host memory utilization has remained above 90 percent for ten minutes.

      - alert: VcarHostRootFilesystemLow
        expr: 100 * node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"} < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Vcar host root filesystem is nearly full
          description: Less than 10 percent of root filesystem capacity remains available for five minutes.
