[project]
name = "vcar-platform"
version = "0.1.0"
description = "Vcar ride-hailing platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiogram>=3.31.0,<4",
  "aiohttp>=3.14.5,<4",
  "asyncpg>=0.32.0,<1",
  "redis>=7.4.1,<8",
  "fastapi>=0.162.4,<1",
  "uvicorn[standard]>=0.54.0,<1",
  "PyJWT[crypto]>=2.15.1,<3",
  "pydantic>=2.13.5,<2.14",
  "alembic>=1.20.1,<2",
  "SQLAlchemy[asyncio]>=2.0.57,<2.1",
  "httpx>=0.28.1,<1",
]

[dependency-groups]
dev = [
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.4.1.post1,<2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = false
