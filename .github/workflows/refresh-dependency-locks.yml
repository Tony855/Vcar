name: Refresh dependency lockfiles

on:
  push:
    branches: ["maintenance/dependency-modernization"]
    paths:
      - "pyproject.toml"
      - "web_frontend/package.json"
      - ".github/workflows/refresh-dependency-locks.yml"

permissions:
  contents: write

concurrency:
  group: dependency-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv lock generator
        run: python -m pip install --disable-pip-version-check uv==0.13.5
      - name: Refresh npm lockfile from the official registry
        working-directory: web_frontend
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org
      - name: Resolve and export Python lock
        run: |
          uv lock --upgrade
          uv export --locked --no-dev --format requirements-txt --output-file requirements.txt
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock requirements.txt web_frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles are already current."
            exit 0
          fi
          git commit -m "build: refresh reproducible dependency lockfiles"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
