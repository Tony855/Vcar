name: CI

on:
  push:
    branches: ["main", "refactor/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://vcar:test@127.0.0.1:5432/vcar
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: vcar
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vcar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcar -d vcar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app migrations tests
      - run: bash -n deploy/install.sh scripts/*.sh
      - run: DATABASE_URL=postgresql://vcar:test@127.0.0.1:5432/vcar alembic upgrade head --sql
      - run: grep -v '^\\' app/db/schema.sql | docker run --rm -i --network host postgis/postgis:16-3.4 psql "$DATABASE_URL" -v ON_ERROR_STOP=1
      - run: alembic upgrade head
      - run: test "$(docker run --rm --network host postgis/postgis:16-3.4 psql "$DATABASE_URL" -Atc "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_name IN ('driver_locations','trip_tracks','wallet_accounts','wallet_transactions')) = 4 AND EXISTS (SELECT 1 FROM pg_extension WHERE extname='postgis')")" = "t"
      - run: alembic downgrade 20261111_0001 && alembic upgrade head
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json
      - run: npm ci
        working-directory: web_frontend
      - run: npm run build
        working-directory: web_frontend
