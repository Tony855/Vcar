name: CI

on:
  push:
    branches: ["main", "maintenance/**", "refactor/**", "reliability/**"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vcar-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql://vcar:test@127.0.0.1:5432/vcar
      REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:8.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_USER: vcar
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vcar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vcar -d vcar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.13.5
      - name: Validate locked Python dependencies
        run: uv sync --locked --all-groups
      - run: uv run --no-sync python -m compileall -q app migrations tests
      - run: bash -n deploy/install.sh scripts/*.sh
      - name: Validate Prometheus alert rules
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 check rules /etc/prometheus/vcar-alert-rules.yml
      - name: Evaluate Prometheus alert behavior
        run: docker run --rm --entrypoint promtool -v "$PWD/deploy/monitoring:/etc/prometheus:ro" prom/prometheus:v3.5.0 test rules /etc/prometheus/vcar-alert-tests.yml
      - run: DATABASE_URL=postgresql://vcar:test@127.0.0.1:5432/vcar uv run --no-sync alembic upgrade head --sql
      - run: grep -v '^\\\\' app/db/schema.sql | docker run --rm -i --network host postgis/postgis:16-3.7 psql "$DATABASE_URL" -v ON_ERROR_STOP=1
      - run: uv run --no-sync alembic upgrade head
      - run: test "$(docker run --rm --network host postgis/postgis:16-3.7 psql "$DATABASE_URL" -Atc "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_name IN ('driver_locations','trip_tracks','wallet_accounts','wallet_transactions')) = 4 AND EXISTS (SELECT 1 FROM pg_extension WHERE extname='postgis')")" = "t"
      - run: uv run --no-sync alembic downgrade 20261111_0001 && uv run --no-sync alembic upgrade head
      - name: Rehearse full PostGIS backup and restore
        if: matrix.python-version == '3.13'
        run: |
          export RESTORE_DATABASE_URL=postgresql://vcar:test@127.0.0.1:5432/vcar_restore
          docker run --rm --network host postgis/postgis:16-3.7 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.restore_rehearsal_sentinel (marker text PRIMARY KEY, created_at timestamptz NOT NULL DEFAULT now()); INSERT INTO public.restore_rehearsal_sentinel(marker) VALUES ('vcar-ci-restore-checkpoint')"
          docker run --rm --network host postgis/postgis:16-3.7 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE vcar_restore"
          mkdir -p /tmp/vcar-restore-rehearsal
          docker run --rm --network host -v /tmp/vcar-restore-rehearsal:/backup postgis/postgis:16-3.7 pg_dump --format=custom --no-owner --no-acl --file=/backup/vcar.dump "$DATABASE_URL"
          test -s /tmp/vcar-restore-rehearsal/vcar.dump
          docker run --rm --network host -v /tmp/vcar-restore-rehearsal:/backup postgis/postgis:16-3.7 pg_restore --list /backup/vcar.dump >/dev/null
          docker run --rm --network host -v /tmp/vcar-restore-rehearsal:/backup postgis/postgis:16-3.7 pg_restore --exit-on-error --single-transaction --no-owner --no-acl --dbname="$RESTORE_DATABASE_URL" /backup/vcar.dump
          test "$(docker run --rm --network host postgis/postgis:16-3.7 psql "$RESTORE_DATABASE_URL" -Atc "SELECT (SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('driver_locations','trip_tracks','wallet_accounts','wallet_transactions')) = 4 AND EXISTS (SELECT 1 FROM pg_extension WHERE extname='postgis')")" = "t"
          test "$(docker run --rm --network host postgis/postgis:16-3.7 psql "$RESTORE_DATABASE_URL" -Atc "SELECT count(*) FROM public.restore_rehearsal_sentinel WHERE marker='vcar-ci-restore-checkpoint'")" = "1"
      - name: Verify supported installer operating systems in containers
        run: |
          docker run --rm -v "$PWD/scripts/check_supported_os.sh:/check_supported_os.sh:ro" debian:13-slim bash /check_supported_os.sh /etc/os-release
          docker run --rm -v "$PWD/scripts/check_supported_os.sh:/check_supported_os.sh:ro" ubuntu:24.04 bash /check_supported_os.sh /etc/os-release
      - run: uv run --no-sync pytest -q
      - name: Verify Redis process restart recovery with the original client pool
        if: matrix.python-version == '3.13'
        run: uv run --no-sync python scripts/test_redis_process_recovery.py
      - run: uv run --no-sync pip-audit -r requirements.txt
      - name: Verify restricted runtime database role
        run: |
          OWNER_BOOTSTRAP_URL="$DATABASE_URL"
          python deploy/bootstrap_env.py --env-file /tmp/vcar-ci.env --write-role-sql /tmp/vcar-ci-roles.sql
          grep -v '^MIGRATION_DATABASE_URL=' /tmp/vcar-ci.env > /tmp/vcar-ci.runtime.env
          ! grep -q '^MIGRATION_DATABASE_URL=' /tmp/vcar-ci.runtime.env
          set -a
          . /tmp/vcar-ci.env
          set +a
          docker run --rm --network host -v /tmp/vcar-ci-roles.sql:/roles.sql postgis/postgis:16-3.7 psql "$OWNER_BOOTSTRAP_URL" -v ON_ERROR_STOP=1 -f /roles.sql
          docker run --rm --network host postgis/postgis:16-3.7 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT 1 FROM users LIMIT 1"
          if docker run --rm --network host postgis/postgis:16-3.7 psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE TABLE public.runtime_role_must_not_create(id integer)"; then
            echo "Runtime role unexpectedly has DDL privileges" >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26.13.0"
          cache: npm
          cache-dependency-path: web_frontend/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
        working-directory: web_frontend
      - run: npm audit --audit-level=high
        working-directory: web_frontend
      - run: npm run build
        working-directory: web_frontend
