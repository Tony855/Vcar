name: vcar-routing
services:
  osrm-prepare:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["prepare"]
    volumes:
      - ./data/osrm:/data
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      test -s /data/cambodia-latest.osm.pbf || {
        echo "Missing data/osrm/cambodia-latest.osm.pbf; run scripts/download_map_data.sh" >&2
        exit 1
      }
      osrm-extract -p /opt/car.lua /data/cambodia-latest.osm.pbf
      osrm-partition /data/cambodia-latest.osrm
      osrm-customize /data/cambodia-latest.osrm
    restart: "no"
  osrm:
    image: osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "--max-table-size", "100", "/data/cambodia-latest.osrm"]
    volumes:
      - ./data/osrm:/data:ro
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:5000/nearest/v1/driving/104.9282,11.5564' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
